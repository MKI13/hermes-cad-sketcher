name: Hermes CAD Function Parity
description: Make a Hermes CAD feature fully functional and SketchUp-like without copying SketchUp assets.
title: "feat(<area>): <function> functional parity"
labels: ["agent-task", "cad", "quality-gate"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must become truly functional?
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: SketchUp behavior baseline
      description: Official sources, observed workflow, and non-copying boundary.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Hermes behavior
      description: Current files, current behavior, known gaps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include model logic, UI, tests, docs, versioning, rollback.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      value: |
        npm ci
        npm run test
        npm run check
        npm run smoke:browser
    validations:
      required: true
